[project]
name = "nms-optimizer-service"
version = "5.21.1"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.deptry]
exclude = ["scripts", "wasm"]

[tool.deptry.per_rule_ignores]
DEP001 = ["src"]
DEP003 = ["flask", "flask_compress", "flask_cors", "flask_socketio", "gevent", "torch", "numpy", "google"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "5.21.1"
version_files = [
    "pyproject.toml:version"
]
tag_format = "v$version"
